apiVersion: v1
kind: Namespace
metadata:
  name: mpi-tfgii
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mpi-data-pv
  labels:
    app: mpi
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  claimRef:
    namespace: mpi-tfgii
    name: mpi-data
  hostPath:
    path: /var/lib/mpi-data
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mpi-data
  namespace: mpi-tfgii
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mpi
  namespace: mpi-tfgii
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mpi
  template:
    metadata:
      labels:
        app: mpi
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: mpi
          image: ghcr.io/drem-link/mpi-tfgii:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: MPI_DATASET_PATH
              value: /var/lib/mpi/deposits.zip
          volumeMounts:
            - name: data
              mountPath: /var/lib/mpi
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mpi-data
        - name: tmp
          emptyDir:
            sizeLimit: 600Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mpi
  namespace: mpi-tfgii
spec:
  type: NodePort
  selector:
    app: mpi
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
